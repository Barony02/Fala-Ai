<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Gerenciamento de Usuários</title>
    <link rel="stylesheet" href="/css/style.css"> 
    <link rel="stylesheet" href="/css/gerenciar-usuarios.css"> 
</head>
<body>
    <div class="app-container">
        <div id="sidebar-container"></div>

        <main class="content">
            <div class="page-header">
                <div>
                    <h1>Gerenciamento de Usuários</h1>
                    <p id="info-perfil" style="margin: 4px 0 0 0; color: var(--text-muted); font-size: 0.9rem;"></p>
                </div>
                <button class="btn-primary" id="btn-abrir-cadastro">＋ Novo Usuário</button>
            </div>

            <div id="mensagem" style="margin-bottom: 16px; font-weight: 600;"></div>

            <div class="toolbar">
                <input type="text" id="filtro-busca" class="search-input" placeholder="Pesquisar por nome, e-mail, perfil ou setor...">
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th data-coluna="id">ID <span class="sort-arrow"></span></th>
                            <th data-coluna="nome">Nome <span class="sort-arrow"></span></th>
                            <th data-coluna="email">E-mail <span class="sort-arrow"></span></th>
                            <th data-coluna="perfil">Perfil <span class="sort-arrow"></span></th>
                            <th data-coluna="setor_sigla">Setor <span class="sort-arrow"></span></th>
                            <th data-coluna="ativo">Status <span class="sort-arrow"></span></th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-usuarios"></tbody>
                </table>
            </div>
        </main>
    </div>

    <div class="modal-overlay" id="modalForm">
        <div class="modal-card">
            <div class="modal-header">
                <h2 id="form-title">Cadastrar Novo Usuário</h2>
                <button class="modal-close" id="btn-fechar-modal">&times;</button>
            </div>
            <form id="userForm">
                <div class="modal-body">
                    <input type="hidden" id="userId">
                    
                    <div class="form-group">
                        <label for="nome">Nome</label>
                        <input type="text" id="nome" required>
                    </div>

                    <div class="form-group">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" required>
                    </div>

                    <div class="form-group" id="senha-container">
                        <label for="senha">Senha</label>
                        <input type="password" id="senha" required>
                    </div>

                    <div class="form-group">
                        <label for="perfil">Perfil</label>
                        <select id="perfil" required>
                            <option value="Solicitante">Solicitante</option>
                            <option value="Gestor">Gestor</option>
                            <option value="Administrador" id="opt-admin">Administrador</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="setor">Setor</label>
                        <select id="setor" required>
                            <option value="" disabled selected>Selecione um setor...</option>
                            </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-secondary" id="btn-cancelar-modal">Cancelar</button>
                    <button type="submit" class="btn-primary" id="btn-salvar">Cadastrar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/js/sidebar.js"></script>
    <script src="/js/gerenciar-usuarios.js"></script>
</body>
</html>
