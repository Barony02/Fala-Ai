<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Gerenciar Setores</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/gerenciar-setores.css">
</head>
<body>
    <div class="app-container">
        <div id="sidebar-container"></div>

        <main class="content">
            <div class="page-header">
                <div>
                    <h1>Gerenciamento de Setores</h1>
                    <p id="info-perfil" style="color: var(--text-muted); font-size: 0.9rem; margin-top: 4px;"></p>
                </div>
                <button class="btn-primary" id="btn-abrir-cadastro">＋ Novo Setor</button>
            </div>

            <div id="mensagem" style="margin-bottom: 16px; font-weight: 600;"></div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Sigla</th>
                            <th>Funcionários</th>
                            <th>Em Aberto</th>
                            <th>Em Andamento</th>
                            <th>Fechados</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-setores"></tbody>
                </table>
            </div>

            <div class="chamados-detalhes" id="painel-chamados">
                <h2 id="titulo-chamados-setor">Chamados do Setor</h2>
                <table style="margin-top: 15px;">
                    <thead>
                        <tr>
                            <th>Título</th>
                            <th>Prioridade</th>
                            <th>Status</th>
                            <th>Data de Abertura</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-chamados-setor"></tbody>
                </table>
            </div>
        </main>
    </div>

    <div class="modal-overlay" id="modalForm" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.4); display: none; justify-content: center; align-items: center; z-index: 1000;">
        <div style="background: white; padding: 24px; border-radius: 8px; width: 100%; max-width: 400px;">
            <h2 id="form-title" style="margin-top: 0;">Cadastrar Setor</h2>
            <form id="setorForm" style="margin-top: 15px;">
                <input type="hidden" id="setorId">
                <div style="margin-bottom: 12px;">
                    <label style="display:block; margin-bottom: 4px;">Nome do Setor</label>
                    <input type="text" id="nome" style="width: 100%; padding: 8px; box-sizing: border-box;" required>
                </div>
                <div style="margin-bottom: 16px;">
                    <label style="display:block; margin-bottom: 4px;">Sigla</label>
                    <input type="text" id="sigla" style="width: 100%; padding: 8px; box-sizing: border-box;" required>
                </div>
                <div style="display: flex; justify-content: flex-end; gap: 8px;">
                    <button type="button" class="btn-secondary" id="btn-fechar-modal" style="padding: 8px 16px;">Cancelar</button>
                    <button type="submit" class="btn-primary" style="padding: 8px 16px;">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/js/sidebar.js"></script>
    <script src="/js/gerenciar-setores.js"></script>
</body>
</html>
